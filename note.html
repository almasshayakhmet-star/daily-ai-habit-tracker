<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Rock Paper Scissors</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .game {
      width: min(90vw, 480px);
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.5rem;
    }
    .choices {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .status {
      margin: 12px 0;
      min-height: 48px;
      line-height: 1.5;
    }
    .score {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Rock Paper Scissors</h1>
    <p>Works fully offline. Save this file and open it in any browser.</p>
    <div class="choices">
      <button data-choice="rock" aria-label="Play Rock">🪨 Rock</button>
      <button data-choice="paper" aria-label="Play Paper">📄 Paper</button>
      <button data-choice="scissors" aria-label="Play Scissors">✂️ Scissors</button>
      <button id="reset" aria-label="Reset game scores">Reset</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">Pick your move to start.</div>
    <div class="score">
      <span>You: <span id="you">0</span></span>
      <span>CPU: <span id="cpu">0</span></span>
    </div>
  </main>

  <script>
    const moves = ["rock", "paper", "scissors"];
    const beats = { rock: "scissors", paper: "rock", scissors: "paper" };
    const statusEl = document.getElementById("status");
    const youEl = document.getElementById("you");
    const cpuEl = document.getElementById("cpu");
    let you = 0;
    let cpu = 0;

    function play(playerMove) {
      const cpuMove = moves[Math.floor(Math.random() * moves.length)];
      let result = "Draw";

      if (playerMove !== cpuMove) {
        if (beats[playerMove] === cpuMove) {
          you += 1;
          result = "You win";
        } else {
          cpu += 1;
          result = "CPU wins";
        }
      }

      youEl.textContent = you;
      cpuEl.textContent = cpu;
      statusEl.textContent = `You: ${playerMove} | CPU: ${cpuMove} → ${result}`;
    }

    document.querySelectorAll("button[data-choice]").forEach((btn) => {
      btn.addEventListener("click", () => play(btn.dataset.choice));
    });

    document.getElementById("reset").addEventListener("click", () => {
      you = 0;
      cpu = 0;
      youEl.textContent = "0";
      cpuEl.textContent = "0";
      statusEl.textContent = "Score reset. Pick your move to start.";
    });
  </script>
</body>
</html>
